name: Deploy frontend to Hostinger

# Every push to main: build the static export and upload it to Hostinger over
# FTP (upload-only — old build chunks are kept so CDN/browser-cached HTML never
# 404s a chunk and throws ChunkLoadError).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # Uses .env.production -> NEXT_PUBLIC_API_URL=https://main.heltog.com/api/v1
        run: npm run build

      - name: Verify build is self-consistent (no missing chunks)
        run: |
          miss=0
          while read -r html; do
            while read -r a; do
              [ -f "out${a}" ] || { echo "MISSING: $a (referenced in $html)"; miss=$((miss+1)); }
            done < <(grep -ohE '/_next/static/[^"]+\.(js|css)' "$html" | sort -u)
          done < <(find out -name '*.html')
          if [ "$miss" -ne 0 ]; then echo "Build has $miss missing assets — aborting deploy."; exit 1; fi
          echo "Build OK — all referenced assets present."

      - name: Deploy to Hostinger via FTP (upload-only, never delete)
        # We intentionally do NOT delete old files. Hostinger's CDN caches HTML
        # for a long time; if a deploy deleted the previous build's chunks, that
        # cached HTML would 404 them (ChunkLoadError). Keeping old chunks means
        # any cached HTML — CDN or browser — always finds the chunks it asks for.
        # Orphan chunks are tiny and harmless.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 25
          mirror -R --only-newer --parallel=4 --verbose ./out/ "$FTP_SERVER_DIR"
          bye
          EOF
