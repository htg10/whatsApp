name: Deploy frontend to Hostinger (manual / legacy FTP)

# DISABLED on push. Hostinger's native "Connected with GitHub" auto-deployment
# now builds and deploys the app on every push to main (see the site's
# Deployments tab). This FTP workflow is kept for manual use only — running it
# alongside the native deploy caused conflicts and inode/quota FTP failures.
# Trigger it by hand from the Actions tab only if the native deploy is ever off.
on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # Uses .env.production -> NEXT_PUBLIC_API_URL=https://main.heltog.com/api/v1
        run: npm run build

      - name: Verify build is self-consistent (no missing chunks)
        run: |
          miss=0
          while read -r html; do
            while read -r a; do
              [ -f "out${a}" ] || { echo "MISSING: $a (referenced in $html)"; miss=$((miss+1)); }
            done < <(grep -ohE '/_next/static/[^"]+\.(js|css)' "$html" | sort -u)
          done < <(find out -name '*.html')
          if [ "$miss" -ne 0 ]; then echo "Build has $miss missing assets — aborting deploy."; exit 1; fi
          echo "Build OK — all referenced assets present."

      - name: Deploy to Hostinger via FTP
        # One mirror of the whole build. --delete keeps the web root EXACTLY the
        # build (orphan chunks from old deploys are removed) so the account's disk
        # quota is never filled by accumulated builds. HTML is served no-cache
        # (see public/.htaccess), so browsers always fetch fresh HTML that points
        # at the chunks that are actually present — no ChunkLoadError. Flush the
        # Hostinger CDN after a deploy so its edge cache doesn't serve stale HTML.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 5
          set net:timeout 30
          set mirror:parallel-transfer-count 1
          set mirror:use-pget-n 1
          # Remove the previous build's _next FIRST so its (many) old chunk files
          # free disk space AND inodes before we upload — otherwise a full/large
          # account rejects new uploads with 550 (quota / No such file or directory)
          # because --delete only prunes AFTER uploading. -f = no error if absent.
          rm -r -f "$FTP_SERVER_DIR/_next"
          mirror -R --delete --verbose ./out/ "$FTP_SERVER_DIR"
          bye
          EOF
